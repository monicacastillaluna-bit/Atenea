<meta charset="utf-8">
<style>
  body { margin:0; background:#fff; font-family:Inter,"Segoe UI",system-ui,sans-serif; }
  .grafico { width:1200px; padding:26px 30px 22px; background:#F8F9FA; }
  .serif { font-family:Merriweather,Georgia,serif; }
</style>

<div class="grafico">
<svg width="1140" height="772" viewBox="0 0 1140 772" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8.5" refY="3.6"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8.5,3.6 L0,7.2 z" fill="#1A365D"/>
    </marker>
    <marker id="rojaAb" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#E05A47"/>
    </marker>
  </defs>

  <!-- ============ PELDAÑOS 0-2 · educación básica ============ -->
  <g>
    <rect x="52"  y="550" width="108" height="50"  fill="#C9D3E0"/>
    <rect x="160" y="500" width="108" height="100" fill="#C9D3E0"/>
    <rect x="268" y="450" width="108" height="150" fill="#C9D3E0"/>
    <rect x="52"  y="550" width="108" height="6" fill="#A9B7CA"/>
    <rect x="160" y="500" width="108" height="6" fill="#A9B7CA"/>
    <rect x="268" y="450" width="108" height="6" fill="#A9B7CA"/>
  </g>

  <!-- ============ PELDAÑOS 3-8 · opacidad creciente ============ -->
  <g fill="#D4AF37">
    <rect x="376" y="400" width="108" height="200" opacity="0.55"/>
    <rect x="484" y="350" width="108" height="250" opacity="0.64"/>
    <rect x="592" y="300" width="108" height="300" opacity="0.73"/>
    <rect x="700" y="250" width="108" height="350" opacity="0.82"/>
    <rect x="808" y="200" width="108" height="400" opacity="0.91"/>
    <rect x="916" y="150" width="108" height="450" opacity="1"/>
  </g>
  <g fill="#A8842A">
    <rect x="376" y="400" width="108" height="6"/>
    <rect x="484" y="350" width="108" height="6"/>
    <rect x="592" y="300" width="108" height="6"/>
    <rect x="700" y="250" width="108" height="6"/>
    <rect x="808" y="200" width="108" height="6"/>
    <rect x="916" y="150" width="108" height="6"/>
  </g>

  <!-- ============ NÚMEROS ============ -->
  <g class="serif" font-size="29" font-weight="700" fill="#1A365D" text-anchor="middle">
    <text x="106"  y="588">0</text>
    <text x="214"  y="538">1</text>
    <text x="322"  y="488">2</text>
    <text x="430"  y="438">3</text>
    <text x="538"  y="388">4</text>
    <text x="646"  y="338">5</text>
    <text x="754"  y="288">6</text>
    <text x="862"  y="238">7</text>
    <text x="970"  y="188">8</text>
  </g>

  <!-- ============ ETIQUETAS (banda inferior, leen de abajo hacia arriba) ============ -->
  <g font-size="14.5" font-weight="600" fill="#1A365D" text-anchor="end">
    <text transform="translate(112,614) rotate(-90)">Inicial · preescolar</text>
    <text transform="translate(220,614) rotate(-90)">Primaria</text>
    <text transform="translate(328,614) rotate(-90)">Secundaria</text>
    <text transform="translate(436,614) rotate(-90)">Bachillerato</text>
    <text transform="translate(544,614) rotate(-90)">Tecnólogo</text>
    <text transform="translate(652,614) rotate(-90)">Técnico superior</text>
    <text transform="translate(760,614) rotate(-90)">Licenciatura</text>
    <text transform="translate(868,614) rotate(-90)">Especialidad · maestría</text>
    <text transform="translate(976,614) rotate(-90)">Doctorado</text>
  </g>

  <!-- ============ EJE DE AUTONOMÍA ============ -->
  <line x1="60" y1="560" x2="1000" y2="118" stroke="#1A365D" stroke-width="2.4"
        stroke-dasharray="7 5" marker-end="url(#flecha)" opacity="0.7"/>
  <text x="516" y="318" class="serif" font-size="17.5" font-weight="700" fill="#1A365D"
        transform="rotate(-25.2 516 318)">más autonomía · menos supervisión</text>

  <!-- ============ LEYENDA DE ZONAS (esquina superior izquierda) ============ -->
  <rect x="62" y="128" width="26" height="16" fill="#C9D3E0"/>
  <text x="98" y="141" font-size="14.5" fill="#5A5A5A">
    Educación básica: aquí se planea con PDA
  </text>
  <rect x="62" y="158" width="26" height="16" fill="#D4AF37"/>
  <text x="98" y="171" font-size="14.5" font-weight="600" fill="#8A6D1F">
    Aquí le van a pedir resultados de aprendizaje
  </text>

  <!-- ============ AVISO DE CALIBRACIÓN ============ -->
  <text x="62" y="252" class="serif" font-size="16" font-weight="700" fill="#E05A47">
    El error más común en revisión
  </text>
  <text x="62" y="276" font-size="14.5" fill="#B8442F">
    Escribir un resultado de nivel 2
  </text>
  <text x="62" y="296" font-size="14.5" fill="#B8442F">
    en un programa de nivel 6.
  </text>
  <text x="62" y="316" font-size="14.5" fill="#B8442F">
    Está bien redactado — y le falta nivel.
  </text>

  <!-- línea roja: el techo del nivel 2 proyectado sobre licenciatura -->
  <line x1="376" y1="453" x2="792" y2="453" stroke="#E05A47" stroke-width="2.2"
        stroke-dasharray="6 5"/>
  <!-- brecha vertical en el peldaño 6 -->
  <line x1="784" y1="453" x2="784" y2="266" stroke="#E05A47" stroke-width="2.2"
        marker-end="url(#rojaAb)"/>
  <text x="772" y="360" font-size="13.5" font-weight="700" fill="#E05A47"
        text-anchor="end">esta es la brecha</text>
</svg>
</div>
